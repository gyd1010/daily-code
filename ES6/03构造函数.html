<body>
  <script>
    class Person {
      constructor(name, age) {
        this.name = name
        this.age = age
      }
      say() {
        console.log(`my name is ${this.name},i am ${this.age} years old`)
      }
    }
    let person = new Person("zhangsan", 18)
    console.log(person)
    person.say()
  </script>
