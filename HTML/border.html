<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            height: 41px;
            background-color: #fcfcfc;
            border-top: 3px solid #ff8500;
            border-bottom: 1px solid #edeef0;
            line-height: 41px;
        }

        div a {
            height: 41px;
            font-size: 14px;
            color: #4c4c4c;
            text-decoration: none;
            padding: 0 20px;
            display: inline-block;
        }

        a:hover {
            background-color: #eee;
            color: #ff8500
        }
    </style>
</head>

<body>
    <div>
        <a href="#">新的手机</a>
        <a href="#">小米</a>
        <a href="#">人机不协调</a>
        <a href="#">真的吗</a>
    </div>
</body>

</html>
