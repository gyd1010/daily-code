<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f5f5f5;
        }

        .box {
            width: 298px;
            height: 480px;
            background-color: #fff;
            margin: 100px auto;
        }

        img {
            width: 100%;
        }

        .review {
            height: 70px;
            font-size: 14px;
            padding: 0 28px;
            margin-top: 30px;
        }

        .reshu {
            font-size: 12px;
            color: #b0b0b0;
            margin-top: 20px;
            padding-left: 28px;
        }

        .info {
            font-size: 14px;
            padding: 0 28px;
            margin-top: 20px;
        }

        .info h4 {
            font-weight: 400;
            display: inline-block;
        }

        .info span {
            color: #ff6700;
        }

        .info em {
            color: #ebe4e0;
            font-style: normal;
            margin-left: 15px;
            margin-right: 7px;
        }

        .info a {
            color: black;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="box">
        <img src="/HTML/tupian.png">
        <p class="review">你们总以为力量来自规则，可规则只是弱者为了限制强者创造出来的东西。</p>
        <div class="reshu">
            来自神的评价
        </div>
        <div class="info">
            <h4><a href="#">祖国人自传</a></h4>
            <em>|</em>
            <span>1亿元</span>
        </div>
</body>

</html>
