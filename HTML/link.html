<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>侧边栏</title>
    <style>
        a {
            display: block;
            background-color: #55585a;
            color: #f0f0f0;
            font-size: 14px;
            width: 100px;
            height: 30px;
            line-height: 30px;
            text-decoration: none;
            text-indent: 2em;
        }

        a:hover {
            background-color: #ff6700;
        }
    </style>
</head>

<body>
    <a href="#">link1</a>
    <a href="#">link2</a>
    <a href="#">link3</a>
    <a href="#">link4</a>
</body>

</html>
