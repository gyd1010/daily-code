<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    const date = + new Date()
    const last = new Date("2026-06-30 12:00:00")
    const count = date - last
    let d = Math.floor(count / 1000 / 60 / 60 / 24)
    let h = Math.floor(count / 1000 / 60 / 60 % 24)
    let m = Math.floor(count / 1000 / 60 % 60)
    let s = Math.floor(count / 1000 % 60)
    h = h < 10 ? '0' + h : h
    m = m < 10 ? '0' + m : m
    s = s < 10 ? '0' + s : s
    console.log(d, h, m, s)
  </script>
</body>

</html>
