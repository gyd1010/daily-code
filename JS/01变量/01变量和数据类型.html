<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    h2 {
      text-align: center;
    }

    td,
    th {
      border: 1px solid black;
    }

    th {
      padding: 5px 20px;
    }

    table {
      margin: 0 auto;
      height: 80px;
      border-collapse: collapse;
      text-align: center;
    }
  </style>
</head>

<body>


  <script>
    let price = prompt("请输入商品价格：");
    let quantity = prompt("请输入商品数量：");
    let address = prompt("请输入收货地址：");
    document.write(`
    <h2>订单确认</h2>
    <table>
    <tr>
      <th>商品名称</th>
      <th>商品价格</th>
      <th>商品数量</th>
      <th>单价</th>
      <th>收货地址</th>
    </tr>
    <tr>  
      <td>小米手机</td>
      <td>${price}元</td>
      <td>${quantity}</td>
      <td>${price * quantity}元</td>
      <td>${address}</td>
    </tr>
    </table>`)
  </script>
</body>

</html>
